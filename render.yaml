# Render Blueprint: free backend web service (Docker) + free static frontend.
# New → Blueprint → pick this repo, then enter TOMTOM_API_KEY when asked.
# If Render gives a service a different subdomain than its name, update
# VITE_API_BASE (frontend) and CORS_ALLOWED_ORIGINS (backend) to the real URLs.
services:
  - type: web
    name: weather-aware-truck-routing-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile # repo-root paths (no rootDir): unambiguous
    dockerContext: ./backend
    healthCheckPath: /api/schema/
    envVars:
      - key: TOMTOM_API_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://weather-aware-truck-routing.onrender.com

  - type: web
    name: weather-aware-truck-routing
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://weather-aware-truck-routing-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
