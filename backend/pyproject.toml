[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/W: pycodestyle (PEP8), F: pyflakes, I: isort, N: pep8-naming,
# B: bugbear, UP: pyupgrade, DJ: Django, SIM: simplify
select = ["E", "W", "F", "I", "N", "B", "UP", "DJ", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["config", "routes", "weather"]
